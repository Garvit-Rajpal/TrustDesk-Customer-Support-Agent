services:
  postgres:
    # V4-9 (LLD_v4 §5, HLD_v4 ADR-21): swapped from postgres:16 for the
    # vector extension (W15 similarity ingestion) — same Postgres 16
    # on-disk format, existing local volumes keep working unmodified.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trustdesk
      POSTGRES_PASSWORD: trustdesk
      POSTGRES_DB: trustdesk
    ports:
      - "5432:5432"
    volumes:
      - trustdesk_pg_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  trustdesk_pg_data:
